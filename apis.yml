name: Ekomoditi
description: eKomoditi (PT Ekomoditi Solutions Indonesia) is a Southeast Asian agriculture-technology
  company, founded in 2015 and based in Jakarta, that builds digital plantation-management
  software for oil palm, rubber, sugar, and durian estates. Its flagship Electronic
  Plantation Control System (ePCS) replaces paper-based field recording with a mobile
  in-field Android app, an eGIS geographic mapping application, mills automation, and
  business-intelligence analytics — capturing harvesting, fertilization, pest-management,
  worker, and transport data for same-day reporting, labor-fraud monitoring, quality
  control, and traceability. eKomoditi also offers aerial-mapping drone services, a
  plantation marketplace, and due-diligence consulting. The company is backed by 500
  Global and ZB Capital. It does not currently publish a public developer API, SDKs,
  or API documentation.
